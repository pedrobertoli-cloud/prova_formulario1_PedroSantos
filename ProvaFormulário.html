<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prova Formulário</title>
    <link rel="stylesheet" href="_CSS/estilo.css">
</head>

<body>
    <form>
        <h1>Exemplos de Formulário em HTML</h1>
        <hr>
        <h3>Exemplo 01</h3>
        <input class="form1" type="text" name="nome" placeholder="Nome">
        <input class="form1" type="text" name="email" placeholder="Email">
        <input class="form1" type="text" name="telefone" placeholder="Celular">
        <input class="form1" type="text" name="senha" placeholder="Senha">
        <input class="cadastro" type="submit" value="Cadastrar">
        <hr>
        <h3>Exemplo 02</h3>
        <textarea class="text1" name="text1" id="text1"></textarea>
        <hr>
        <h3>Exemplo 03</h3>
        <fieldset class="field1">
            <legend>Formulário</legend>
            <label>Nome:<input type="text" name="nome"></label>
            <p></p>
            <label>Sexo: <input type="radio" name="sexo" value="opcao"> Masculino</label>
            <input type="radio" name="sexo" value="opcao"> Feminino
            <p></p>
            <label>País: <select>
                    <option>Selecione uma Opção</option>
                    <option>Brasil</option>
                    <option>México</option>
                    <option>Paraguai</option>
                    <option>Bolívia</option>
                </select></label>
            <p></p>
            <label>Mensagem:<br><textarea class="fieldtext" name="text2"></textarea></label>
            <p></p>
            <input type="checkbox" name="sim"> Assinar Newsletter?
            <br><br>
            <input class="field" type="submit" value="Enviar">
        </fieldset>
        <hr>
        <h3>Exemplo 04</h3>
        <input type="search" class="ex4" name="text3" id="text3"></textarea>
        <input class="pesquisa" type="submit" value="Clique para Pesquisar">
        <hr>
        <h3>Exemplo 05</h3>
        <fieldset class="field2">
            <legend>Selecione a cor que mais agrada:</legend>
            <input type="checkbox" name="opcao">Azul
            <input type="checkbox" name="opcao">Vermelho
            <input type="checkbox" name="opcao">Verde
            <input type="checkbox" name="opcao">Amarelo
        </fieldset>

    </form>
</body>

</html>
